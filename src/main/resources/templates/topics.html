<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Topic and unit management')}"></head>
<body>
<aside th:replace="~{fragments/nav :: sidebar('topics')}"></aside>
<div class="main-shell">
    <header th:replace="~{fragments/nav :: topbar('Topics & units')}"></header>
    <main class="main-content">
        <div class="page-heading"><div><div class="eyebrow">Curriculum</div><h1>Topics and units</h1><p>Add a subject, unit, and topic name. A topic reference PDF is optional.</p></div></div>
        <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
        <div class="row g-4">
            <div class="col-lg-4"><section class="card"><div class="card-header px-4 py-3">Add topic</div><div class="card-body p-4">
                <form method="post" th:action="@{/topics}" th:object="${topicForm}">
                    <div class="mb-3"><label class="form-label" for="topicName">Topic name</label><input class="form-control" id="topicName" th:field="*{topicName}" maxlength="150" required><div class="invalid-feedback d-block" th:errors="*{topicName}"></div></div>
                    <div class="mb-3"><label class="form-label" for="topicSubject">Subject</label><select class="form-select" id="topicSubject" th:field="*{subjectId}" required><option value="">Choose subject</option><option th:each="subject : ${subjects}" th:value="${subject.id}" th:text="${subject.subjectName}"></option></select><div class="invalid-feedback d-block" th:errors="*{subjectId}"></div></div>
                    <div class="mb-3"><label class="form-label" for="unitNumber">Unit number</label><input class="form-control" id="unitNumber" th:field="*{unitNumber}" type="number" min="1" required><div class="invalid-feedback d-block" th:errors="*{unitNumber}"></div></div>
                    <button class="btn btn-primary" type="submit">Add topic</button>
                </form>
            </div></section></div>
            <div class="col-lg-8"><section class="card"><div class="card-header px-4 py-3">Curriculum map</div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Subject</th><th>Unit</th><th>Topic and PDFs</th></tr></thead><tbody>
                <tr th:each="topic : ${topics}" th:id="|topic-${topic.id}|">
                    <td class="fw-semibold" th:text="${topic.subject.subjectName}"></td>
                    <td><span class="badge-soft" th:text="'Unit ' + topic.unitNumber"></span></td>
                    <td>
                        <div class="fw-semibold" th:text="${topic.topicName}"></div>
                        <div class="topic-pdf-list mt-2">
                            <div th:each="pdf : ${topicPdfs[topic.id]}" class="topic-pdf-item">
                                <a th:href="@{/topics/{topicId}/pdfs/{pdfId}(topicId=${topic.id},pdfId=${pdf.id})}"
                                   th:text="${pdf.originalFilename}"></a>
                                <span class="text-muted small" th:text="${pdf.fileSize} + ' bytes'"></span>
                            </div>
                            <div th:if="${#lists.isEmpty(topicPdfs[topic.id])}" class="text-muted small">Reference PDF (optional): none uploaded.</div>
                        </div>
                        <form class="topic-pdf-upload mt-2" method="post" enctype="multipart/form-data"
                              th:action="@{/topics/{topicId}/pdfs(topicId=${topic.id})}">
                            <input class="form-control form-control-sm" type="file" name="files" accept=".pdf,application/pdf"
                                   aria-label="Select topic PDF files" multiple required>
                            <button class="btn btn-sm btn-outline-primary mt-2" type="submit">Upload PDFs</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(topics)}"><td colspan="3"><div class="empty-state">No topics yet. Add a subject and define its syllabus units.</div></td></tr>
            </tbody></table></div></section></div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
