<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Download PDF')}"></head>
<body>
<aside th:replace="~{fragments/nav :: sidebar('generate')}"></aside>
<div class="main-shell">
    <header th:replace="~{fragments/nav :: topbar('Download question paper')}"></header>
    <main class="main-content">
        <div class="page-heading"><div><div class="eyebrow">Export</div><h1>Download PDF</h1><p>Your PDF is generated from the saved examination paper and keeps its exact saved question selection.</p></div></div>
        <section class="card mx-auto" style="max-width:680px"><div class="card-body p-4 p-lg-5 text-center">
            <div class="metric-icon mx-auto mb-3">↓</div>
            <h2 class="h5 fw-bold" th:text="${paper.examTitle}"></h2>
            <p class="text-secondary small" th:text="${paper.subject.subjectName}"></p>
            <div class="d-flex flex-wrap justify-content-center gap-3 small text-secondary mb-4">
                <span th:text="${paper.totalQuestions} + ' questions'"></span><span>·</span><span th:text="${paper.totalMarks} + ' marks'"></span><span>·</span><span th:text="${paper.duration} + ' minutes'"></span>
            </div>
            <a class="btn btn-primary px-4" th:href="@{/api/papers/{id}/pdf(id=${paper.id})}">Download PDF</a>
            <div class="mt-3"><a class="small text-decoration-none" th:href="@{/papers/{id}(id=${paper.id})}">← Back to paper preview</a></div>
        </div></section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
