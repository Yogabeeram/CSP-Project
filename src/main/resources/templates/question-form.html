<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${question == null ? 'Add question' : 'Edit question'})}"></head>
<body>
<aside th:replace="~{fragments/nav :: sidebar('questions')}"></aside>
<div class="main-shell">
    <header th:replace="~{fragments/nav :: topbar(${question == null ? 'Add question' : 'Edit question'})}"></header>
    <main class="main-content">
        <div class="page-heading"><div><div class="eyebrow">Question bank</div><h1 th:text="${question == null ? 'Add a question' : 'Edit question'}">Add a question</h1><p>Provide the prompt, curriculum placement and classification.</p></div><a class="btn btn-outline-secondary" th:href="@{/questions}">← Back to bank</a></div>
        <div id="formMessage" class="alert d-none" role="alert"></div>
        <section class="card">
            <div class="card-body p-4 p-lg-5">
                <form id="questionForm" novalidate th:attr="data-question-id=${question != null ? question.id : ''}">
                    <div class="mb-4"><label class="form-label" for="questionText">Question text</label><textarea class="form-control" id="questionText" rows="5" maxlength="65535" required th:text="${question != null ? question.questionText : ''}" placeholder="Write a clear, assessable question..."></textarea><div class="form-hint mt-1">Question text cannot be empty.</div><div class="invalid-feedback">Enter the question text.</div></div>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label" for="subjectId">Subject</label><select class="form-select" id="subjectId" required><option value="">Choose subject</option><option th:each="subject : ${subjects}" th:value="${subject.id}" th:text="${subject.subjectName}" th:selected="${question != null and subject.id == question.subjectId}"></option></select><div class="invalid-feedback">Choose a subject.</div></div>
                        <div class="col-md-6"><label class="form-label" for="topicId">Topic</label><select class="form-select" id="topicId" required><option value="">Choose topic</option><option th:each="topic : ${topics}" th:value="${topic.id}" th:attr="data-subject-id=${topic.subject.id}" th:text="${topic.topicName + ' · Unit ' + topic.unitNumber}" th:selected="${question != null and topic.id == question.topicId}"></option></select><div class="invalid-feedback">Choose a topic.</div></div>
                        <div class="col-md-4"><label class="form-label" for="marks">Marks</label><input class="form-control" id="marks" type="number" min="1" step="1" required th:value="${question != null ? question.marks : ''}"><div class="invalid-feedback">Marks must be a positive whole number.</div></div>
                        <div class="col-md-4"><label class="form-label" for="difficulty">Difficulty</label><select class="form-select" id="difficulty" required><option value="">Choose difficulty</option><option th:each="level : ${difficulties}" th:value="${level}" th:text="${level}" th:selected="${question != null and level == question.difficulty}"></option></select><div class="invalid-feedback">Choose difficulty.</div></div>
                        <div class="col-md-4"><label class="form-label" for="bloomLevel">Bloom level</label><select class="form-select" id="bloomLevel" required><option value="">Choose Bloom level</option><option th:each="level : ${bloomLevels}" th:value="${level}" th:text="${level}" th:selected="${question != null and level == question.bloomLevel}"></option></select><div class="invalid-feedback">Choose a Bloom level.</div></div>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/questions}">Cancel</a><button class="btn btn-primary px-4" type="submit" th:text="${question == null ? 'Add question' : 'Save changes'}">Save question</button></div>
                </form>
            </div>
        </section>
    </main>
</div>
<script>
const questionForm = document.getElementById("questionForm");
const subjectSelect = document.getElementById("subjectId");
const topicSelect = document.getElementById("topicId");
function filterTopics(resetSelection) {
    const selectedTopic = topicSelect.value;
    if (resetSelection) topicSelect.value = "";
    topicSelect.querySelectorAll("option[data-subject-id]").forEach((option) => {
        option.hidden = subjectSelect.value !== "" && option.dataset.subjectId !== subjectSelect.value;
    });
    if (!resetSelection && selectedTopic) topicSelect.value = selectedTopic;
}
subjectSelect.addEventListener("change", () => filterTopics(true));
filterTopics(false);
questionForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    questionForm.classList.add("was-validated");
    const marks = Number(document.getElementById("marks").value);
    if (!questionForm.checkValidity() || !Number.isInteger(marks) || marks <= 0) return;
    const body = {
        questionText: document.getElementById("questionText").value.trim(),
        subjectId: Number(subjectSelect.value),
        topicId: Number(topicSelect.value),
        marks,
        difficulty: document.getElementById("difficulty").value,
        bloomLevel: document.getElementById("bloomLevel").value
    };
    const id = questionForm.dataset.questionId;
    const message = document.getElementById("formMessage");
    try {
        const response = await fetch(id ? `/api/questions/${id}` : "/api/questions", {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (response.ok) {
            message.className = "alert alert-success";
            message.textContent = id ? "Question updated. Returning to the question bank…" : "Question added. Returning to the question bank…";
            window.setTimeout(() => window.location.assign("/questions"), 900);
            return;
        }
        const error = await response.json().catch(() => ({}));
        message.className = "alert alert-danger";
        const validationDetails = Object.entries(error.validationErrors || {})
            .map(([field, detail]) => `${field}: ${detail}`);
        message.textContent = [error.message, ...validationDetails].filter(Boolean).join(" ") ||
            "Could not save this question. Check the selected subject and topic.";
    } catch (error) {
        message.className = "alert alert-danger";
        message.textContent = "Could not reach the application. Check the server connection and try again.";
    }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
